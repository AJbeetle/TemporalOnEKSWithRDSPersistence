apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-rds-secret
  namespace: temporal
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: temporal-rds-secret
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: rds!db-056ba095-2bda-4093-b3fa-c1eaa5c1221e
        property: username

    - secretKey: password
      remoteRef:
        key: rds!db-056ba095-2bda-4093-b3fa-c1eaa5c1221e
        property: password

    - secretKey: RDSHOST
      remoteRef:
        key: RDSHOSTNAME-for-temporal
        property: RDSHOST