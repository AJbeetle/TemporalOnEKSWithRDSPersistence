apiVersion: batch/v1
kind: Job

metadata:
  name: temporal-db-init
  namespace: temporal

spec:
  template:
    spec:
      restartPolicy: Never
      # backoffLimit: 3

      volumes:
        - name: rds-ca-cert
          configMap:
            name: rds-ca-cert

      containers:
        - name: postgres-init
          image: postgres:15

          volumeMounts:
            - name: rds-ca-cert
              mountPath: /certs
              readOnly: true

          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: temporal-rds-secret
                  key: RDSHOST

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              value: postgres

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: temporal-rds-secret
                  key: username

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-rds-secret
                  key: password

            - name: PGSSLMODE
              value: verify-full

            - name: PGSSLROOTCERT
              value: /certs/global-bundle.pem

          command:
            - sh
            - -c
            - |
              echo "Creating Temporal databases safely..."

              psql <<EOF

              SELECT 'CREATE DATABASE temporal'
              WHERE NOT EXISTS (
                SELECT FROM pg_database WHERE datname = 'temporal'
              )\gexec

              SELECT 'CREATE DATABASE temporal_visibility'
              WHERE NOT EXISTS (
                SELECT FROM pg_database WHERE datname = 'temporal_visibility'
              )\gexec

              EOF

              echo "Database setup completed."