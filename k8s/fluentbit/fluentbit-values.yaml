kind: DaemonSet

serviceAccount:
  create: false
  name: fluent-bit

tolerations:
  - operator: Exists

config:
  service: |
    [SERVICE]
        Flush              1
        Daemon             Off
        Log_Level          info
        Parsers_File       /fluent-bit/etc/parsers.conf
        HTTP_Server        On
        HTTP_Listen        0.0.0.0
        HTTP_Port          2020
        Health_Check       On

  inputs: |
    [INPUT]
        Name               tail
        Path               /var/log/containers/*payment-worker*.log
        multiline.parser   docker, cri
        Tag                payment-worker
        Mem_Buf_Limit      10MB
        Skip_Long_Lines    On
        Refresh_Interval   5

  filters: |
    [FILTER]
        Name                kubernetes
        Match               payment-worker
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

  outputs: |
    [OUTPUT]
        Name                cloudwatch_logs
        Match               payment-worker
        region              us-east-1
        log_group_name      /eks/payment-worker
        log_stream_prefix   fluentbit-
        auto_create_group   true